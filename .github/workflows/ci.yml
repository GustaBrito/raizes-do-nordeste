name: CI — Raizes do Nordeste

# Pipeline de integração contínua para o projeto UNINTER 2026.
# Executa build e testes do backend (.NET 8) e frontend (Vue 3).

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # ==========================================================
  # Backend — .NET 8
  # ==========================================================
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/RaizesDoNordeste.API/RaizesDoNordeste.API.csproj

      - name: Build
        run: dotnet build src/RaizesDoNordeste.API/RaizesDoNordeste.API.csproj --no-restore --configuration Release

      - name: Testes unitários
        run: |
          dotnet test testes/RaizesDoNordeste.Testes.Unitarios/RaizesDoNordeste.Testes.Unitarios.csproj \
            --configuration Release \
            --logger "trx;LogFileName=unitarios.trx" \
            --results-directory ../resultados-testes

      - name: Testes de integração
        run: |
          dotnet test testes/RaizesDoNordeste.Testes.Integracao/RaizesDoNordeste.Testes.Integracao.csproj \
            --configuration Release \
            --logger "trx;LogFileName=integracao.trx" \
            --results-directory ../resultados-testes

      - name: Suíte de regressão (Trait=Regressao)
        run: |
          dotnet test testes/RaizesDoNordeste.Testes.Integracao/RaizesDoNordeste.Testes.Integracao.csproj \
            --configuration Release \
            --filter "Categoria=Regressao" \
            --logger "trx;LogFileName=regressao.trx" \
            --results-directory ../resultados-testes

      - name: Upload resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backend
          path: resultados-testes/

  # ==========================================================
  # Frontend — Vue 3 + Vitest
  # ==========================================================
  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (se configurado)
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Testes (Vitest)
        run: npm test -- --run

      - name: Cobertura (meta ≥ 80%)
        run: npm run test:coverage --if-present

      - name: Upload cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/

  # ==========================================================
  # Gate de qualidade — só aprova o PR se todos os jobs passarem
  # ==========================================================
  quality-gate:
    name: Gate de Qualidade
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: OK
        run: echo "✅ Backend e Frontend aprovados — pronto para merge."
